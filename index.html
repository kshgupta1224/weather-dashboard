<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Weather Dashboard</h1>

    <form id="search-form" class="search">
      <input id="city-input" type="text" placeholder="Enter US city (e.g. Seattle, WA)" required />
      <button type="submit">Search</button>
      <button type="button" id="location-btn" class="location-btn" title="Use my location">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="12" cy="12" r="3"></circle>
          <line x1="12" y1="2" x2="12" y2="6"></line>
          <line x1="12" y1="18" x2="12" y2="22"></line>
          <line x1="2" y1="12" x2="6" y2="12"></line>
          <line x1="18" y1="12" x2="22" y2="12"></line>
        </svg>
      </button>
    </form>

    <section id="current-weather" class="card hidden">
      <h2 id="current-city"></h2>
      <div class="current-meta">
        <div id="current-temp" class="big"></div>
        <div id="current-desc"></div>
      </div>
      <ul id="current-details" class="details"></ul>
    </section>

    <section id="forecast" class="cards hidden">
      <h3>5-Day Forecast</h3>
      <div id="forecast-cards" class="forecast-grid"></div>
    </section>

    <footer>
      <small>Data from National Weather Service (weather.gov). US locations only.</small>    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
